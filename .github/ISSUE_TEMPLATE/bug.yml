name: Bug report
description: Something Glidepath did wrong or failed to do.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `glidepath ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `glidepath doctor`
      description: Paste the whole output. Remove anything private, such as repo names or tokens.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `glidepath --version`
      placeholder: "glidepath 1.3.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4"
    validations:
      required: true
