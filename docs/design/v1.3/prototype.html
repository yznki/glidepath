<title>Glidepath Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a macOS desktop. Menubar glyph, a heavy glass popover holding a Wallet-style stack of light glass cards, and the main window beside it. */
/* Single dark look by choice: black glass, silver light, one sodium-amber signal for "changes". */
:root{
  --void:#030304; --mat:rgba(11,11,14,.84); --edge:rgba(255,255,255,.07); --fg:#ececef; --mute:rgba(236,236,242,.4);
  --tint:rgba(20,20,25,.66); --hi:rgba(255,255,255,.15); --row:rgba(255,255,255,.045);
  --approve:#f1f1f3; --changes:#d29b45; --skipped:#4d4e56; --run:#ffffff;
  --tracer:conic-gradient(from var(--a),transparent 0 62%,rgba(255,255,255,.95) 94%,transparent);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  color-scheme:dark;
}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--sys);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.desk{min-height:100%;overflow:hidden;background:radial-gradient(30% 70% at 28% -10%,rgba(255,255,255,.075),transparent 70%),radial-gradient(25% 60% at 78% -10%,rgba(255,255,255,.05),transparent 70%),linear-gradient(180deg,#0a0a0d,var(--void) 60%)}
.bar{height:28px;display:flex;align-items:center;justify-content:flex-end;gap:14px;font-size:13px;font-weight:600;background:var(--mat);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar time{color:var(--mute);font-variant-numeric:tabular-nums}
.glyph{position:relative;width:30px;height:22px;border:0;border-radius:6px;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.glyph:hover,.glyph[aria-expanded="true"]{background:var(--row)}
.glyph svg{width:17px;height:17px}
.glyph.run svg{animation:glide 1.8s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--run))}
@keyframes glide{0%,100%{translate:-1.5px 1px;rotate:-7deg}50%{translate:1.5px -1px;rotate:5deg}}
.glyph b{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--changes);box-shadow:0 0 6px var(--changes);scale:0;transition:scale .4s cubic-bezier(.3,1.6,.4,1)}
.glyph b.on{scale:1}

.stage{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding-block:10px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.material{background:var(--mat);backdrop-filter:blur(40px) saturate(1.9);-webkit-backdrop-filter:blur(40px) saturate(1.9);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 40px 90px -30px rgba(0,0,0,.65),0 8px 24px -8px rgba(0,0,0,.35)}

/* Popover */
.pop{position:relative;width:min(100%,360px);border-radius:28px;overflow:hidden;transition:height .5s cubic-bezier(.3,1.1,.4,1),opacity .3s,scale .4s cubic-bezier(.3,1.2,.4,1),filter .4s;transform-origin:70% 0}
.pop.closed{opacity:0;scale:.9;filter:blur(12px);pointer-events:none}
.aura{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 50% at 50% -12%,rgba(255,255,255,.07),transparent 70%)}
.aura i{display:none}
.head{position:relative;z-index:200;height:66px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px}
.pips{display:flex;gap:2px;flex:1}
.pip{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:6px 12px;border:0;border-radius:12px;background:none;color:var(--c);font:200 26px/1 var(--sys);letter-spacing:-.02em;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .2s,opacity .3s}
.pip small{font:600 9px/1 var(--sys);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.pip:hover{background:var(--row)}
.pip.off{opacity:.25}
.go{position:relative;width:34px;height:34px;border-radius:50%;border:0;background:var(--row);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:scale .15s}
.go:active{scale:.9}
.go svg{width:12px;height:12px;position:relative}
.go::before{content:"";position:absolute;inset:-1px;border-radius:50%;padding:1.5px;background:var(--tracer);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .5s;animation:rot 2.2s linear infinite}
.go.run::before{opacity:1}
@keyframes rot{to{--a:360deg}}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* Glass card */
.card{--vc:var(--skipped);position:absolute;left:12px;right:12px;top:0;height:64px;border-radius:20px;transition:height .55s cubic-bezier(.3,1.15,.4,1);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 0}
.card.v-approve{--vc:var(--approve)}.card.v-changes{--vc:var(--changes)}.card.s-running{--vc:var(--run)}
.card.open{height:232px}
.aig{position:absolute;inset:-6px;border-radius:26px;background:var(--tracer);filter:blur(14px);opacity:0;transition:opacity .8s;animation:rot 2.6s linear infinite}
.g{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%),var(--tint);
  backdrop-filter:blur(var(--blur,22px)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur,22px)) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -14px 30px -18px rgba(0,0,0,.45),0 20px 40px -22px rgba(0,0,0,.75),0 2px 8px -2px rgba(0,0,0,.35)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,var(--hi),transparent 38%,transparent 70%,rgba(255,255,255,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.light{position:absolute;right:-50px;top:-50px;width:150px;height:110px;border-radius:50%;background-color:var(--vc);filter:blur(44px);opacity:.12;transition:background-color 1s,opacity .8s}
.v-changes .light{opacity:.26}
.s-queued .light,.v-skipped .light{opacity:0}
.held .light{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.08;scale:.85}50%{opacity:.42;scale:1.1}}
.spec{position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,30%) var(--my,-10%),rgba(255,255,255,.22),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover .spec,.card.open .spec{opacity:1}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);translate:-120% 0;pointer-events:none}
.flash .sheen{animation:sheen .9s cubic-bezier(.3,.7,.3,1)}
@keyframes sheen{to{translate:120% 0}}
.ai{position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--tracer);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .8s;animation:rot 2.6s linear infinite;pointer-events:none}
.s-running .ai{opacity:1}.s-running .aig{opacity:.75}

.row{position:relative;display:flex;align-items:center;gap:13px;height:64px;padding:0 20px 0 14px;box-sizing:border-box}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font:500 12px/1 var(--sys);color:var(--fg);letter-spacing:.06em;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.6)}
.s-queued .av{opacity:.35}
.nm{font-size:15px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-queued .nm{color:var(--mute)}
.vd{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--vc)}
.v-skipped .vd{color:var(--mute)}
.vd i{width:6px;height:6px;border-radius:50%;background:var(--vc);box-shadow:0 0 8px var(--vc)}
.v-skipped .vd i{background:none;box-shadow:inset 0 0 0 1px var(--mute)}
.s-queued .vd,.s-running .vd{color:var(--mute)}.s-queued .vd i{background:none;box-shadow:inset 0 0 0 1px var(--mute)}
.s-running .vd span{background:linear-gradient(90deg,var(--mute) 30%,var(--fg) 50%,var(--mute) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.body{position:relative;padding:2px 20px 18px;display:flex;flex-direction:column;gap:8px;height:calc(100% - 64px);box-sizing:border-box;opacity:0;translate:0 8px;transition:opacity .3s,translate .45s cubic-bezier(.3,1.2,.4,1)}
.open .body,.flat .body{opacity:1;translate:0 0;transition-delay:.08s}
.body h3{margin:0;font-size:21px;font-weight:650;line-height:1.15;letter-spacing:-.025em;text-wrap:balance}
.meta{font-size:12.5px;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums;display:flex;gap:10px}
.meta em{font-style:normal;color:var(--fg);opacity:.75}
.why{margin:0;font-size:14px;line-height:1.42;opacity:.8;letter-spacing:-.005em}
.act{margin-top:auto;display:flex;gap:8px}
.hold,.open-gh{position:relative;flex:1;height:44px;border-radius:22px;border:0;overflow:hidden;background:var(--row);color:var(--fg);font:600 14px/44px var(--sys);text-align:center;text-decoration:none;cursor:pointer;box-shadow:inset 0 0 0 1px var(--edge);transition:scale .15s}
.hold:active{scale:.97}
.hold .liq{position:absolute;inset:0;background:var(--vc);transform-origin:left;scale:var(--p,0) 1;box-shadow:0 0 30px var(--vc)}
.hold span{position:relative}
.hold.done{background:var(--vc);color:#050506}
.hold .liq{background:linear-gradient(90deg,rgba(255,255,255,.15),var(--vc))}
.ghost{height:44px;padding:0 16px;border-radius:22px;border:0;background:none;color:var(--mute);font:600 14px var(--sys);cursor:pointer}
.ghost:hover{color:var(--fg)}
.empty{position:absolute;inset:60px 0 0;display:grid;place-content:center;justify-items:center;gap:12px;color:var(--mute);font-size:15px;font-weight:600}
.empty svg{width:40px;height:40px;opacity:.6;animation:glide 3.5s ease-in-out infinite}

/* Window */
.win{position:relative;width:min(100%,960px);height:680px;border-radius:18px;display:flex;overflow:hidden}
.gdot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 6px rgba(255,255,255,.5)}
.glyph.run .gdot{animation:pulse 1.2s ease-in-out infinite}
.gcount{font:600 12.5px/1 var(--sys);font-variant-numeric:tabular-nums}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition-duration:0s!important}

/* Settings */
.search{width:100%;box-sizing:border-box;height:38px;border-radius:11px;border:0;background:var(--row);box-shadow:inset 0 0 0 1px var(--edge);color:var(--fg);font:500 14px var(--sys);padding:0 14px;margin-bottom:12px}
.search:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--fg)}
.chips-nav{position:sticky;top:-16px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin-bottom:4px;background:linear-gradient(var(--mat) 70%,transparent)}
.chip{height:28px;padding:0 12px;border-radius:14px;border:0;background:var(--row);color:var(--mute);font:600 12px var(--sys);cursor:pointer;transition:color .2s,background .2s}
.chip:hover,.chip.on{color:var(--fg);background:var(--tint)}
.gh{margin:22px 0 9px 4px}
.sgroup{scroll-margin-top:50px}
.item .lbl small:empty{display:none}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.rng{display:flex;align-items:center;gap:12px}
.rng input{-webkit-appearance:none;appearance:none;width:170px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--f),var(--edge) var(--f));cursor:pointer}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#f4f4f6;box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.12);transition:scale .15s}
.rng input:active::-webkit-slider-thumb{scale:1.18}
.rng input::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#f4f4f6}
.val{min-width:84px;text-align:right;font:500 13px var(--sys);font-variant-numeric:tabular-nums}
.tiles{display:flex;gap:8px}
.tile{width:78px;height:64px;border-radius:13px;border:0;background:var(--row);box-shadow:inset 0 0 0 1px var(--edge);color:var(--fg);display:grid;place-items:center;align-content:center;gap:7px;cursor:pointer;font:600 9px var(--sys);letter-spacing:.16em;text-transform:uppercase;transition:box-shadow .2s,transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--fg)}
.tface{height:18px;display:grid;place-items:center}.tface svg{width:17px;height:17px}
.swatches{display:flex;gap:10px}
.swatch{width:28px;height:28px;border-radius:50%;border:0;background:var(--c);cursor:pointer;box-shadow:0 0 0 2px var(--void),0 0 14px -2px var(--c);transition:transform .25s cubic-bezier(.3,1.6,.4,1)}
.swatch:hover{transform:scale(1.12)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--void),0 0 0 4px var(--fg),0 0 18px -2px var(--c)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.tag{height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--tint);box-shadow:inset 0 0 0 1px var(--edge);font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;align-items:center;gap:2px}
.tag button{width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--mute);cursor:pointer;font-size:10px}
.tag button:hover{color:var(--fg);background:var(--row)}
.tags input{width:140px;height:26px;border:1px dashed var(--edge);border-radius:13px;background:none;color:var(--fg);font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 10px}
.tags input:focus{outline:none;border-color:var(--mute)}
.keycap{min-width:120px;height:34px;padding:0 14px;border-radius:9px;border:0;background:linear-gradient(var(--tint),rgba(0,0,0,.2));box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 3px 0 rgba(0,0,0,.6);color:var(--fg);font:500 15px var(--sys);letter-spacing:.12em;cursor:pointer;transition:transform .1s,box-shadow .1s}
.keycap:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 1px 0 rgba(0,0,0,.6)}
.keycap.rec{font-size:12px;letter-spacing:.04em;color:var(--changes);box-shadow:inset 0 0 0 1.5px var(--changes),0 0 18px -4px var(--changes)}
.btn{height:32px;padding:0 14px;border-radius:9px;border:0;background:var(--tint);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge);color:var(--fg);font:500 13px var(--sys);cursor:pointer}
.btn:active{scale:.96}
.item .hold{flex:none;width:160px;height:36px;line-height:36px;font-size:13px}
.meter svg{width:54px;height:54px;display:block}
.mtrack,.mfill{fill:none;stroke-width:4}.mtrack{stroke:var(--edge)}
.mfill{stroke:var(--fg);stroke-linecap:round;stroke-dasharray:138.2;transform:rotate(-90deg);transform-origin:27px 27px;transition:stroke-dashoffset .6s cubic-bezier(.3,1.1,.4,1),stroke .4s}
.meter.hot .mfill{stroke:var(--changes)}
.meter text{fill:var(--fg);font:600 10px var(--sys);text-anchor:middle}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(400px,92%);z-index:40;box-sizing:border-box;padding:18px 20px;overflow:auto;background:rgba(6,6,8,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:-30px 0 60px -20px rgba(0,0,0,.8),inset 1px 0 0 var(--edge);translate:105% 0;transition:translate .55s cubic-bezier(.3,1.1,.4,1)}
.drawer.on{translate:0 0}
#toml{margin:0;font:12px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#toml .k{color:var(--mute)}#toml .s{color:var(--fg);font-weight:600}
#toml .ln2{display:inline-block;width:100%;border-radius:4px}
#toml .chg{animation:chg 1.6s ease-out}
@keyframes chg{0%{background:rgba(255,255,255,.22)}100%{background:transparent}}
.toast{position:absolute;left:50%;bottom:22px;z-index:50;translate:-50% 16px;opacity:0;padding:10px 16px;border-radius:12px;background:rgba(240,240,244,.95);color:#0a0a0c;font:500 13px var(--sys);pointer-events:none;transition:opacity .3s,translate .45s cubic-bezier(.3,1.3,.4,1)}
.toast.on{opacity:1;translate:-50% 0}

/* Schedule */
.ph .cap#sstatus{color:var(--fg)}
.sched{display:grid;grid-template-columns:minmax(260px,350px) minmax(0,1fr);gap:34px;align-items:start}
#dsvg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}
.d-base{fill:none;stroke:var(--row);stroke-width:18}
.d-arc{fill:none;stroke:var(--fg);stroke-width:18;stroke-linecap:round}
.d-glow{stroke-opacity:.35;filter:url(#glow)}
.d-tick{stroke:var(--mute);stroke-width:1;opacity:.5}.d-tick.maj{opacity:1;stroke-width:1.5}
.d-lbl{fill:var(--mute);font:600 9px var(--sys);letter-spacing:.12em;text-anchor:middle}
.d-dot{fill:var(--fg);opacity:.55}
.d-dot.nx{opacity:1;filter:drop-shadow(0 0 6px #fff);animation:breathe 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d-now{stroke:var(--changes);stroke-width:1.5;stroke-linecap:round}
.d-nowdot{fill:var(--changes)}
.d-face{fill:var(--row);stroke:var(--edge);cursor:ns-resize;transition:fill .2s}
.d-center:hover .d-face{fill:var(--tint)}
.d-big{fill:var(--fg);font:200 46px var(--sys);letter-spacing:-.04em;text-anchor:middle;pointer-events:none}
.d-unit{fill:var(--mute);font:600 8.5px var(--sys);letter-spacing:.24em;text-anchor:middle;pointer-events:none}
.d-hit{fill:transparent;cursor:grab}
.d-knob{fill:#0b0b0e;stroke:var(--fg);stroke-width:2.5;pointer-events:none;transition:r .2s}
.d-h:hover .d-knob,.d-h:focus .d-knob{r:11.5}
.d-h:focus{outline:none}
.dragging .d-hit{cursor:grabbing}
.d-time{fill:var(--fg);font:600 10px var(--sys);text-anchor:middle;font-variant-numeric:tabular-nums;pointer-events:none;paint-order:stroke;stroke:var(--void);stroke-width:4px}
.dial-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preset{text-align:left;padding:14px;border-radius:14px;border:0;background:var(--row);box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 var(--hi);color:var(--fg);cursor:pointer;font:inherit;transition:transform .25s cubic-bezier(.3,1.5,.4,1),box-shadow .2s}
.preset:hover{transform:translateY(-2px)}
.preset b{display:block;font:500 14px var(--sys);margin-bottom:6px}
.preset[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--fg),0 0 24px -10px #fff}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:35px;height:35px;border-radius:50%;border:0;background:var(--row);box-shadow:inset 0 0 0 1px var(--edge);color:var(--mute);font:600 12px var(--sys);cursor:pointer;transition:background .3s,color .3s,transform .35s cubic-bezier(.3,1.7,.4,1)}
.day:active{transform:scale(.9)}
.day[aria-pressed="true"]{background:var(--fg);color:#060607;box-shadow:0 0 18px -6px #fff}
.sstats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.stat.warn b,.stat.warn .cap{color:var(--changes)}
.upcoming{position:relative;display:flex;padding-top:4px;overflow-x:auto}
.upcoming::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--edge)}
.tk{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.tk i{width:9px;height:9px;border-radius:50%;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--mute)}
.tk.first i{background:var(--fg);box-shadow:0 0 12px #fff}
.tk b{font:300 17px/1 var(--sys);font-variant-numeric:tabular-nums}
@media (max-width:760px){.sched{grid-template-columns:1fr}.item{align-items:flex-start}.ctrl{justify-content:flex-start}}
.side{width:196px;flex:none;padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.12)}
.lights{display:flex;gap:8px;padding:0 6px 22px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.side button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--fg);font:500 14px var(--sys);cursor:pointer;text-align:left}
.side button svg{width:17px;height:17px;opacity:.7}
.side button[aria-current="true"]{background:var(--row)}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 26px 26px;overflow:auto}

.card.flat{position:relative;left:auto;right:auto;height:250px;transition:transform .5s cubic-bezier(.3,1.3,.4,1),opacity .4s}
.group{border-radius:14px;background:var(--row);box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px;flex-wrap:wrap}
.item+.item{box-shadow:0 -1px 0 var(--edge)}
.item .lbl{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.item .lbl small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

.seg button{border:0;background:none;color:var(--mute);font:500 12.5px var(--sys);padding:5px 11px;border-radius:7px;cursor:pointer}

.sw{width:44px;height:26px;flex:none;border:0;border-radius:13px;background:var(--edge);position:relative;cursor:pointer;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:translate .35s cubic-bezier(.3,1.4,.4,1)}
.sw[aria-checked="true"]{background:var(--fg)}
.sw[aria-checked="true"]::after{background:#0b0b0e}.sw[aria-checked="true"]::after{translate:18px 0}
.dial{display:flex;align-items:center;gap:26px;margin-top:30px}
.dial b{font-size:clamp(72px,12vw,132px);font-weight:200;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.dial small{display:block;color:var(--mute);font-size:15px;font-weight:500;margin-top:8px}
.dial .go{width:44px;height:44px;font-size:22px;font-weight:300}
.hint{width:100%;text-align:center;color:var(--mute);font-size:12px;font-weight:500;margin:0}

/* Now page */
.cap{font:600 9.5px/1.3 var(--sys);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.cap b{color:var(--fg);font-weight:600}
.now-top{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin:0 0 30px}
.clock{font:200 clamp(64px,9vw,100px)/.85 var(--sys);letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-bottom:12px}
.stats{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.stat b{display:block;font:300 24px/1 var(--sys);letter-spacing:-.02em;margin-bottom:7px;font-variant-numeric:tabular-nums}
.ctl{width:160px}
.ctl .hold,.ctl .open-gh{width:100%;display:block;flex:none}
.rail{display:flex;gap:8px;margin-bottom:28px}
.rail>div{flex:1;min-width:0}
.rail .cap{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .act .cap{color:var(--fg)}
.ln,.lnk{position:relative;overflow:hidden;background:var(--edge)}
.ln{height:2px;border-radius:1px;margin-top:9px}
.rail .done .ln,.lnk.on{background:var(--fg)}
.rail .act .ln::after,.lnk.run::after{content:"";position:absolute;top:0;bottom:0;width:45%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:trace 1.1s linear infinite}
@keyframes trace{from{translate:-100% 0}to{translate:230% 0}}
.thead,.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,280px) 76px;align-items:center;gap:22px}

.thead .track{display:flex;justify-content:space-between;margin:0 -12px}

.prow.v-approve,.prow.v-changes,.prow.v-skipped{cursor:pointer}
.prow.v-approve{--vc:var(--approve)}.prow.v-changes{--vc:var(--changes)}.prow.v-skipped{--vc:var(--skipped)}

.t1{font-size:14px;font-weight:500}

.t2{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prow .track{display:flex;align-items:center}
.node{width:10px;height:10px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--edge)}

<script>
const $ = s => document.querySelector(s);
const S = {
  prs: [
    {id:1,login:'mira-k',title:'Cache invoice PDFs at the edge',n:482,repo:'acme/web',verdict:'approve',reason:'Clean, and tests cover the cache-miss path.'},
    {id:2,login:'devon-p',title:'Move auth tokens to the keychain',n:139,repo:'acme/ios',verdict:'changes',reason:'The token is still logged when refresh fails.',held:true},
    {id:3,login:'sasha-l',title:'Paginate /v2/orders',n:911,repo:'acme/api',verdict:'approve',reason:'Cursor logic is correct, and the backfill script is safe to rerun.',held:true},
    {id:4,login:'jun-ito',title:'Retry webhook delivery with backoff',n:907,repo:'acme/api',verdict:'changes',reason:'Backoff never caps, so a dead endpoint is retried forever.'},
    {id:5,login:'priya-r',title:'Dark mode for settings',n:136,repo:'acme/ios',verdict:'approve',reason:'Uses the theme tokens; snapshots updated.'},
    {id:6,login:'tomasz-w',title:'Bump eslint to v10',n:480,repo:'acme/web',verdict:'skipped',reason:'Lockfile-only change.'},
    {id:7,login:'lena-h',title:'Rate-limit login attempts',n:903,repo:'acme/api',verdict:'changes',reason:'Keyed on IP only, so users behind one NAT lock each other out.'},
    {id:9,login:'mira-k',title:'Checkout flow v2',n:485,repo:'acme/web',draft:true,state:'queued',pending:'changes',pendingReason:'Payment errors are swallowed in step 3.'},
    {id:10,login:'arjun-s',title:'Offline sync spike',n:141,repo:'acme/ios',draft:true,state:'queued',pending:'approve',pendingReason:'Small and contained; the conflict rule is sound.'},
  ],
  pool: [
    {login:'kofi-a',title:'Stream CSV imports',n:915,repo:'acme/api',pending:'approve',pendingReason:'Memory stays flat on the 2 GB fixture.'},
    {login:'elif-y',title:'Fix double charge on retry',n:489,repo:'acme/web',pending:'changes',pendingReason:'The idempotency key is regenerated on every retry.'},
    {login:'noah-b',title:'Haptics on swipe actions',n:144,repo:'acme/ios',pending:'approve',pendingReason:'Respects the system haptics setting.'},
  ],
  filter:null, open:null, hover:null, running:false,
  drafts:false, hold:true, notify:true, login:true, every:30,
  repoDraft:{'acme/web':'inherit','acme/api':'inherit','acme/ios':'inherit'},
};
let nextId = 100;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const WORD = {approve:'Approved',changes:'Changes',skipped:'Skipped'};
const hash = s => [...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const avBg = l => {const h=hash(l);return `linear-gradient(150deg,hsl(240 4% ${26+h%18}%),hsl(240 6% ${7+h%6}%))`};
const ini = l => l.split(/[-_]/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const name = l => l.split(/[-_]/).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
const draftsOn = r => S.repoDraft[r]==='inherit' ? S.drafts : S.repoDraft[r]==='on';
S.prs.forEach(p => {
  p.state ??= 'done';
  p.stage = p.state!=='done' ? 0 : p.verdict==='skipped' ? 1 : p.held ? 3 : 4;
  p.tokens = p.state==='done' && p.verdict!=='skipped' ? 18000 + hash(p.title)%40000 : 0;
});
S.next = 95; S.last = {dur:194, tokens:212400};
const visible = () => S.prs.filter(p => !p.gone && (!p.draft || draftsOn(p.repo)));
const rank = p => p.state==='running'?0 : p.held?1 : p.state==='queued'?2 : 3;
const ordered = () => visible().map((p,i)=>[p,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]);
const shown = () => ordered().filter(p => !S.filter || (p.state==='done' && p.verdict===S.filter));

/* Springs: Apple's damping ratio + response. */
class Spring{
  constructor(v, z=1, r=.4){this.v=v;this.t=v;this.vel=0;this.z=z;this.r=r}
  step(dt){const k=(2*Math.PI/this.r)**2, c=4*Math.PI*this.z/this.r; this.vel+=(-k*(this.v-this.t)-c*this.vel)*dt; this.v+=this.vel*dt}
}
const project = (v, d=.998) => (v/1000)*d/(1-d);
const rubber = (x, dim=280, c=.55) => (x*dim*c)/(dim+c*Math.abs(x));

/* Card markup, shared by the popover stack and the window grid */
function cardEl(p, flat){
  const el = document.createElement('div');
  el.className = 'card' + (flat?' flat':'');
  el.tabIndex = 0; el.setAttribute('role','button');
  el.innerHTML = `<div class="aig"></div><div class="g"><div class="light"></div><div class="spec"></div><div class="sheen"></div>
    <div class="row"><div class="av"></div><div class="nm"></div><div class="vd"><i></i><span></span></div></div><div class="body"></div></div><div class="ai"></div>`;
  el._p = p;
  return el;
}
function paint(el){
  const p = el._p, st = p.state==='done' ? `v-${p.verdict}` : `s-${p.state}`;
  const key = [st,p.held,p.title,p.stage].join();
  for (const c of [...el.classList]) if (/^(v|s)-/.test(c)) el.classList.remove(c);
  el.classList.add(st); el.classList.toggle('held', !!p.held);
  if (el._key === key) return; el._key = key;
  el.querySelector('.av').style.background = avBg(p.login);
  el.querySelector('.av').textContent = ini(p.login);
  el.querySelector('.nm').textContent = name(p.login);
  el.querySelector('.vd span').textContent = p.state==='done' ? WORD[p.verdict] : p.state==='running' ? STAGE[p.stage] || 'Reviewing' : 'Queued';
  el.setAttribute('aria-label', `${name(p.login)}, ${el.querySelector('.vd span').textContent}${p.held?', waiting for you':''}: ${p.title}`);
  el.querySelector('.body').innerHTML = `<h3>${p.title}</h3><div class="meta"><span>#${p.n}</span><span>${p.repo}</span>${p.draft?'<em>Draft</em>':''}</div>
    ${p.state==='done'?`<p class="why">${p.reason}</p>`:''}
    <div class="act">${p.held ? `<button class="hold"><span class="liq"></span><span>Hold to post</span></button><button class="ghost">Discard</button>`
      : p.state==='done' ? `<a class="open-gh" href="https://github.com/${p.repo}/pull/${p.n}" target="_blank" rel="noopener">Open on GitHub</a>` : ''}</div>`;
  const hold = el.querySelector('.hold');
  if (hold) bindHold(hold, () => post(el._p, el, hold));
  el.querySelector('.ghost')?.addEventListener('click', e => { e.stopPropagation(); discard(p); });
}

/* Hold to post: a liquid fill that commits at the end, reverses on release */
function bindHold(btn, onDone){
  let raf, k = 0, down = false;
  const tick = () => {
    k = Math.max(0, Math.min(1, k + (down ? 1/54 : -1/18)));
    btn.style.setProperty('--p', k);
    if (k >= 1) return onDone();
    if (down || k > 0) raf = requestAnimationFrame(tick);
  };
  const start = e => { e.stopPropagation(); if (down) return; down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
  const end = () => { down = false; };
  btn.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(t => btn.addEventListener(t, end));
  btn.addEventListener('click', e => e.stopPropagation());
  btn.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter') { e.preventDefault(); if (!e.repeat) start(e); } });
  btn.addEventListener('keyup', e => { if (e.key===' '||e.key==='Enter') end(); });
}
function flash(p){ for (const el of document.querySelectorAll('.card')) if (el._p===p) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
function post(p, el, btn){
  btn.classList.add('done'); btn.querySelector('span:last-child').textContent = 'Posted';
  flash(p);
  const c = stack.get(p.id); if (c) { c.sp.s.v = .96; }
  setTimeout(() => { p.held = false; p.stage = 4; if (S.open===p.id) S.open = null; render(); }, 750);
}
function discard(p){ p.gone = true; if (S.open===p.id) S.open = null; render(); }

/* Popover stack */
const pop = $('#pop'), host = $('#stack'), stack = new Map();
const HEAD = 66, CH = 232, RH = 64, PAD = 12;
function layout(){
  const L = shown(), n = L.length;
  const strip = n>1 ? Math.min(56, (420-RH)/(n-1)) : 0;
  const Hc = HEAD + (n ? (n-1)*strip + RH : 150) + PAD;
  const Ho = HEAD + CH + 14 + Math.min(n-1,5)*7 + 30 + PAD;
  const H = S.open ? Math.max(Hc, Ho) : Hc;
  pop.style.height = H+'px';
  if (S.open && !L.some(p=>p.id===S.open)) S.open = null;
  const hi = L.findIndex(p=>p.id===S.hover);
  let j = 0;
  for (const [id,c] of stack) {
    const i = L.indexOf(c.el._p);
    c.el.classList.toggle('open', id===S.open);
    if (i < 0) { c.sp.o.t = 0; c.sp.s.t = .92; c.el.style.pointerEvents = 'none'; continue; }
    c.el.style.pointerEvents = ''; c.sp.o.t = 1;
    if (S.open) {
      if (id===S.open) { c.sp.y.t = HEAD; c.sp.s.t = 1; c.el.style.zIndex = 100; }
      else { c.sp.y.t = HEAD + CH + 14 + Math.min(j,5)*7; c.sp.s.t = .94 - Math.min(j,5)*.01; c.el.style.zIndex = 10+j; j++; }
    } else {
      c.sp.y.t = HEAD + i*strip + (hi>=0 && i>hi ? 8 : 0) - (i===hi ? 3 : 0);
      c.sp.s.t = 1; c.el.style.zIndex = i;
    }
  }
  let e = pop.querySelector('.empty');
  if (!n && !e) { e = document.createElement('div'); e.className='empty'; e.innerHTML = GLIDER +(S.filter?'None here':'All clear'); pop.append(e); }
  if (n && e) e.remove();
}
function syncStack(){
  const vis = new Set(visible());
  for (const p of vis) if (!stack.has(p.id)) {
    const el = cardEl(p);
    const c = {el, sp:{y:new Spring(HEAD-30,.86,.45), x:new Spring(0,1,.35), s:new Spring(.9,1,.35), rx:new Spring(0,.8,.4), ry:new Spring(0,.8,.4), o:new Spring(0,1,.3)}};
    bindCard(c); host.append(el); stack.set(p.id, c);
  }
  for (const [id,c] of stack) if (!vis.has(c.el._p)) {
    c.sp.o.t = 0; c.el.style.pointerEvents='none';
    if (!c.gone) { c.gone = true; setTimeout(()=>{ c.el.remove(); stack.delete(id); }, 500); }
  }
  for (const c of stack.values()) paint(c.el);
}
function bindCard(c){
  const el = c.el, id = el._p.id;
  let drag = null;
  el.addEventListener('pointerenter', () => { if (!S.open) { S.hover = id; layout(); } });
  el.addEventListener('pointerleave', () => { if (drag) return; c.sp.rx.t = c.sp.ry.t = 0; if (S.hover===id) { S.hover = null; layout(); } });
  el.addEventListener('pointerdown', e => {
    if (e.button!==0 || e.target.closest('.hold,.ghost,a')) return;
    drag = {x0:e.clientX, y0:e.clientY, dir:null, hist:[]};
    c.sp.s.t = .985; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {

let last = performance.now();
(function frame(now){
  let dt = Math.min(.05, (now-last)/1000); last = now;
  const n = Math.ceil(dt/(1/240));
  for (const c of stack.values()) {
    for (const sp of Object.values(c.sp)) for (let i=0;i<n;i++) sp.step(dt/n);
    const {x,y,s,rx,ry,o} = c.sp;

  }
  requestAnimationFrame(frame);
})(last);

/* Schedule: a 24-hour dial. Drag the two ends of the arc, drag or scroll the centre for the interval. */
const SCH = S.sched = {start:9, end:19, every:30, days:[1,1,1,1,1,0,0], pause:'run'};
const PRESETS = [
  {k:'office', name:'Office hours', sub:'Weekdays 9–18 · 30 min', v:{start:9,end:18,every:30,days:[1,1,1,1,1,0,0]}},
  {k:'clock', name:'Around the clock', sub:'Every day · hourly', v:{start:0,end:24,every:60,days:[1,1,1,1,1,1,1]}},
  {k:'night', name:'Night shift', sub:'Every day 20–04 · 45 min', v:{start:20,end:4,every:45,days:[1,1,1,1,1,1,1]}},
  {k:'focus', name:'Sharp mornings', sub:'Weekdays 7–11 · 15 min', v:{start:7,end:11,every:15,days:[1,1,1,1,1,0,0]}},
];
const fmtH = h => { h = ((h%24)+24)%24; const m = Math.round((h%1)*60); return `${String(h|0).padStart(2,'0')}:${String(m===60?0:m).padStart(2,'0')}`; };
const spanH = () => { let e = SCH.end; while (e <= SCH.start) e += 24; return Math.min(24, e - SCH.start); };
function upcoming(n){
  const out = [], now = new Date(), span = spanH();
  for (let d=0; d<9 && out.length<n; d++) {
    const day = new Date(now); day.setHours(0,0,0,0); day.setDate(day.getDate()+d);
    if (!SCH.days[(day.getDay()+6)%7]) continue;
    for (let m = SCH.start*60; m <= SCH.start*60 + span*60 - (span===24?1:0) && out.length<n; m += SCH.every) {
      const t = new Date(day.getTime() + m*60000); if (t > now) out.push(t);
    }
  }
  return out.sort((a,b)=>a-b).slice(0,n);
}
const pt = (h, r) => { const a = h/24*2*Math.PI - Math.PI/2; return [160 + r*Math.cos(a), 160 + r*Math.sin(a)]; };
function dialSVG(){
  const R = 128, span = spanH(), [sx,sy] = pt(SCH.start,R), [ex,ey] = pt(SCH.start+span,R);
  const arc = span>=24 ? `<circle cx="160" cy="160" r="${R}" class="d-arc"/>` : `<path class="d-arc" d="M${sx} ${sy} A${R} ${R} 0 ${span>12?1:0} 1 ${ex} ${ey}"/>`;
  let ticks = '';
  for (let h=0; h<24; h++) { const [a,b] = pt(h, 146), [c,d] = pt(h, h%6?150:153); ticks += `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="d-tick${h%6?'':' maj'}"/>`; }
  const lbl = [0,6,12,18].map(h => { const [x,y] = pt(h,166); return `<text x="${x}" y="${y+3.5}" class="d-lbl">${String(h).padStart(2,'0')}</text>`; }).join('');
  let dots = '';
  const next = upcoming(1)[0], today = next && next.toDateString()===new Date().toDateString();
  for (let m=0; m <= span*60 - (span===24?1:0); m += SCH.every) {
    const h = SCH.start + m/60, [x,y] = pt(h, 104);
    const isNext = today && Math.abs(((next.getHours()+next.getMinutes()/60) - h%24)) < 1e-6;
    dots += `<circle cx="${x}" cy="${y}" r="${isNext?4.5:2.2}" class="d-dot${isNext?' nx':''}"/>`;
  }
  const now = new Date(), nh = now.getHours()+now.getMinutes()/60+now.getSeconds()/3600, [nx,ny] = pt(nh,138), [nx0,ny0] = pt(nh,74);
  const handle = (k,h) => { const [x,y] = pt(h,R); return `<g class="d-h" data-h="${k}" tabindex="0" role="slider" aria-label="${k==='start'?'Start':'End'} time" aria-valuetext="${fmtH(h)}"><circle cx="${x}" cy="${y}" r="15" class="d-hit"/><circle cx="${x}" cy="${y}" r="9.5" class="d-knob"/></g>`; };
  return `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>
    <circle cx="160" cy="160" r="${R}" class="d-base"/>${arc.replace('d-arc','d-arc d-glow')}${arc}${ticks}${lbl}${dots}
    <line x1="${nx0}" y1="${ny0}" x2="${nx}" y2="${ny}" class="d-now"/><circle cx="${nx}" cy="${ny}" r="3" class="d-nowdot"/>
    <g class="d-center" tabindex="0" role="slider" aria-label="Minutes between sweeps" aria-valuenow="${SCH.every}"><circle cx="160" cy="160" r="64" class="d-face"/>
    <text x="160" y="166" class="d-big">${SCH.every < 60 ? SCH.every : SCH.every%60 ? (SCH.every/60).toFixed(2).replace(/0$/,'') : SCH.every/60}</text>
    <text x="160" y="190" class="d-unit">${SCH.every < 60 ? 'MINUTES' : SCH.every===60 ? 'HOUR' : 'HOURS'}</text></g>
    ${handle('start', SCH.start)}${handle('end', SCH.start+span)}
    <text x="${pt(SCH.start,R)[0]}" y="${pt(SCH.start,R)[1]-16}" class="d-time">${fmtH(SCH.start)}</text>
    <text x="${pt(SCH.start+span,R)[0]}" y="${pt(SCH.start+span,R)[1]-16}" class="d-time">${fmtH(SCH.end)}</text>`;
}
function buildSchedule(){
  $('#sc').innerHTML = `<div class="ph"><h2>Schedule</h2><span class="cap" id="sstatus"></span><div id="pause"></div></div>
    <div class="sched">
      <div class="dialwrap"><svg id="dsvg" viewBox="-14 -14 348 348"></svg>
        <div class="dial-ctl"><button class="go" id="less" aria-label="Less often">−</button><span class="cap">Drag the ends · scroll the centre</span><button class="go" id="more" aria-label="More often">+</button></div></div>
      <div class="sside">
        <div class="cap gh">Presets</div><div class="presets" id="presets"></div>
        <div class="cap gh">Days</div><div class="days" id="days"></div>
        <div class="sstats" id="sstats"></div>
      </div>
    </div>
    <div class="cap gh">Upcoming</div><div class="upcoming" id="upc"></div>`;
  const svg = $('#dsvg');
  let drag = null;
  const hourAt = e => { const r = svg.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*348-14-160, y = (e.clientY-r.top)/r.height*348-14-160;
    return Math.round((((Math.atan2(y,x)+Math.PI/2)/(2*Math.PI)*24)+24)%24*4)/4; };
  svg.addEventListener('pointerdown', e => {
    const h = e.target.closest('.d-h'), c = e.target.closest('.d-center');
    if (h) drag = {k:h.dataset.h}; else if (c) drag = {k:'every', y0:e.clientY, v0:SCH.every}; else return;
    svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (drag.k==='every') setEvery(drag.v0 + Math.round((drag.y0-e.clientY)/14)*15);
    else { const h = hourAt(e); SCH[drag.k] = drag.k==='end' && h===SCH.start ? h+24 : h; if (SCH.end > 24) SCH.end -= 24; schedChanged(); }
  });
  const up = () => { if (drag) { drag = null; svg.classList.remove('dragging'); S.next = Math.max(5, Math.round(((upcoming(1)[0]||Date.now()+3600e3)-Date.now())/1000)); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { if (!e.target.closest('.d-center')) return; e.preventDefault(); setEvery(SCH.every + (e.deltaY<0?15:-15)); }, {passive:false});
  svg.addEventListener('keydown', e => {
    const h = e.target.closest('.d-h'), d = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key]; if (!d) return;
    e.preventDefault();
    if (h) { SCH[h.dataset.h] = ((SCH[h.dataset.h] + d*.25) % 24 + 24) % 24 || (h.dataset.h==='end' ? 24 : 0); schedChanged(); svg.querySelector(`[data-h="${h.dataset.h}"]`).focus(); }
    else if (e.target.closest('.d-center')) { setEvery(SCH.every + d*15); svg.querySelector('.d-center').focus(); }
  });
  $('#less').onclick = () => setEvery(SCH.every+15);
  $('#more').onclick = () => setEvery(SCH.every-15);
  $('#pause').append(segc([['run','Running'],['1h','Pause 1 h'],['tomorrow','Until tomorrow']], ()=>SCH.pause, k=>{ SCH.pause = k; if (k!=='run') toast(k==='1h'?'Paused for an hour':'Paused until tomorrow 09:00'); }));
  for (const p of PRESETS) {
    const b = el('button','preset', `<b>${p.name}</b><span class="cap">${p.sub}</span>`); b.dataset.k = p.k;
    b.onclick = () => tweenSched(p.v); $('#presets').append(b);
  }
  'MTWTFSS'.split('').forEach((d,i) => {
    const b = el('button','day', d); b.setAttribute('aria-label', ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]);
    b.onclick = () => { SCH.days[i] = SCH.days[i] ? 0 : 1; schedChanged(); }; $('#days').append(b);
  });
  schedChanged();
}
function setEvery(v){ SCH.every = Math.max(15, Math.min(240, v)); schedChanged(); }
function tweenSched(v){
  const from = {...SCH}, t0 = performance.now();
  let fe = from.end; while (fe <= from.start) fe += 24; let te = v.end; while (te <= v.start) te += 24;
  SCH.days = [...v.days];
  const step = now => {
    const k = Math.min(1, (now-t0)/650), e = 1 - Math.pow(1-k, 3);
    SCH.start = from.start + (v.start-from.start)*e; SCH.end = (fe + (te-fe)*e) % 24 || 24;
    SCH.every = Math.round((from.every + (v.every-from.every)*e)/5)*5;
    if (k < 1) { schedChanged(true); requestAnimationFrame(step); } else { Object.assign(SCH, {start:v.start, end:v.end, every:v.every}); schedChanged(); }
  };
  requestAnimationFrame(step);
}
function schedChanged(light){
  const svg = $('#dsvg'); if (!svg) return;
  svg.innerHTML = dialSVG();
  if (light) return;
  document.querySelectorAll('.day').forEach((b,i)=>b.setAttribute('aria-pressed', !!SCH.days[i]));
  document.querySelectorAll('.preset').forEach(b => { const p = PRESETS.find(x=>x.k===b.dataset.k).v;
    b.setAttribute('aria-pressed', p.start===SCH.start && p.end%24===SCH.end%24 && p.every===SCH.every && p.days.join()===SCH.days.join()); });
  const days = SCH.days.filter(Boolean).length, perDay = Math.floor((spanH()*60 - (spanH()===24?1:0))/SCH.every)+1, perWeek = perDay*days;
  const weekTok = perWeek * 9000, overBudget = weekTok*4.3 > C.budget*1e6;
  $('#sstats').innerHTML = `<div class="stat"><b>${perDay}</b><span class="cap">Sweeps a day</span></div><div class="stat"><b>${perWeek}</b><span class="cap">A week</span></div>
    <div class="stat${overBudget?' warn':''}"><b>~${fmtM(weekTok*4.3)}</b><span class="cap">${overBudget?'Over budget':'Tokens a month'}</span></div>`;
  const up = upcoming(8), now = new Date();
  $('#upc').innerHTML = up.map((t,i) => `<div class="tk${i?'':' first'}"><i></i><b>${t.toTimeString().slice(0,5)}</b><span class="cap">${t.toDateString()===now.toDateString()?'Today':t.toLocaleDateString('en',{weekday:'short'})}</span></div>`).join('') || '<span class="cap">No sweeps scheduled. Pick at least one day.</span>';
  const n = up[0];
  $('#sstatus').textContent = SCH.pause!=='run' ? 'Paused' : n ? `Next ${n.toTimeString().slice(0,5)} · in ${fmtDur((n-now)/1000)}` : '';
  updateToml();
}
setInterval(() => { if (!$('#sc').hidden && !$('#sc .dragging')) schedChanged(true); }, 30000);

function renderSettings(){ if (!$('#settings').childElementCount) buildSettings(); }
function renderSchedule(){ if (!$('#dsvg')) buildSchedule(); }

function render(keepGrid){
  syncStack(); layout(); pips($('#pips')); pips($('#wpips'));
  if (!$('#rv').hidden && !keepGrid) renderGrid();
  if (!$('#rp').hidden) renderRepos();
  if (!$('#st').hidden) renderSettings();
  if (!$('#sc').hidden) renderSchedule();
  renderNow(); drawGlyph();
  for (const s of ['#glyph','#go','#wgo']) $(s).classList.toggle('run', S.running);
}

/* Now: the live sweep. Stages mirror the app: Gather, Review, Check, Land. */
const STAGE = ['', 'Gather', 'Review', 'Check', 'Land'];
const fmtK = n => n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n|0);
const fmtT = s => { s = Math.max(0, s|0); return `${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
const fmtDur = s => s < 60 ? `${s|0}s` : `${s/60|0}m ${String(s%60|0).padStart(2,'0')}s`;
function nodes(p){
  let h = '';
  for (let i=1;i<=4;i++){
    let c = 'node';
    if (p.state==='running') c += i<p.stage ? ' on' : i===p.stage ? ' cur' : '';
    else if (p.state==='done') c += i===4 && p.stage===4 ? ' land' : i===4 && p.held ? ' wait' : i<=p.stage ? ' on' : '';
    h += `<i class="${c}"></i>`;
    if (i<4) h += `<i class="lnk${(p.state==='running' && i+1===p.stage) ? ' run' : i+1<=p.stage && p.state!=='queued' ? ' on' : ''}"></i>`;
  }
  return h;
}
function renderNow(){
  if ($('#now').hidden) return;
  const r = S.run, L = ordered();
  const waiting = L.filter(p=>p.held).length, queued = L.filter(p=>p.state==='queued').length;
  const label = r ? `<b>Sweeping</b>${r.repo?` · ${r.repo}`:''}${r.phase&&r.phase!=='Reviewing'?` · ${r.phase}`:''}` : S.last?.stopped ? 'Stopped · next sweep' : 'Next sweep';
  const rail = Object.keys(S.repoDraft).map(repo => {
    const st = r ? (r.done.includes(repo) ? 'done' : r.repo===repo ? 'act' : '') : S.last ? 'done' : '';
    return `<div class="${st}"><span class="cap">${repo}${st==='act'&&r.phase?` · ${r.phase}`:''}</span><div class="ln"></div></div>`;
  }).join('');
  const rows = L.map(p => {
    const end = p.state==='running' ? STAGE[p.stage] : p.state==='queued' ? 'Queued' : p.held ? 'Waiting' : WORD[p.verdict];
    return `<div class="prow ${p.state==='running'?'r':p.state==='queued'?'q':''} ${p.state==='done'?`v-${p.verdict}`:''}" data-id="${p.id}">
      <span class="ai"></span>
      <div class="who"><div class="av" style="background:${avBg(p.login)}">${ini(p.login)}</div><div class="tx"><div class="t1">${name(p.login)}${p.draft?' <em>Draft</em>':''}</div><div class="t2">${p.title}</div></div></div>
      <div class="track">${nodes(p)}</div>
      <div class="end"><b data-tok="${p.id}">${p.tokens?fmtK(p.tokens):'—'}</b><span class="cap">${end}</span></div></div>`;
  }).join('');
  const oldCtl = $('#now .ctl');
  $('#now').innerHTML = `<div class="ph"><h2>Now</h2></div>
    <div class="now-top">
      <div><div class="clock" id="clk"></div><div class="cap lbl">${label}</div></div>
      <div class="stats">
        <div class="stat"><b id="ntok">${fmtK(r ? r.tokens : S.last?.tokens || 0)}</b><span class="cap">${r?'Tokens':'Last tokens'}</span></div>
        <div class="stat"><b>${queued}</b><span class="cap">Queued</span></div>
        <div class="stat"><b>${waiting}</b><span class="cap">Waiting</span></div>
        <div class="stat"><b>${S.last ? fmtDur(S.last.dur) : '—'}</b><span class="cap">Last sweep</span></div>
      </div>
      <div class="ctl">${r ? `<button class="hold" id="stop" style="--vc:var(--fg)"><span class="liq"></span><span>${S.stop?'Stopping…':'Hold to stop'}</span></button>`
        : `<button class="open-gh" id="runnow">Run now</button>`}</div>
    </div>
    <div class="rail">${rail}</div>
    <div class="thead"><span></span><div class="track cap"><span>Gather</span><span>Review</span><span>Check</span><span>Land</span></div><span class="cap" style="text-align:right">Tokens</span></div>
    <div class="pipe">${rows || '<p class="cap" style="padding:30px 0;text-align:center">Nothing in flight</p>'}</div>`;
  $('#runnow')?.addEventListener('click', sweep);
  if (r && !S.stop && oldCtl?.querySelector('#stop')) $('#now .ctl').replaceWith(oldCtl);
  else { const stop = $('#stop'); if (stop && !S.stop) bindHold(stop, () => { S.stop = true; renderNow(); }); }
  for (const row of $('#now').querySelectorAll('.prow')) row.onclick = () => {
    const p = S.prs.find(q=>q.id==row.dataset.id); if (p?.state!=='done') return;
    $('#side [data-p="rv"]').click();
  };
  live();
}
function live(){
  const c = $('#clk'); if (!c) return;
  c.textContent = S.run ? fmtT((Date.now()-S.run.started)/1000) : fmtT(S.next);
  if (S.run) $('#ntok').textContent = fmtK(S.run.tokens);
  for (const b of document.querySelectorAll('[data-tok]')) { const p = S.prs.find(q=>q.id==b.dataset.tok); if (p?.tokens) b.textContent = fmtK(p.tokens); }
}

const wait = ms => new Promise(r => setTimeout(r, ms));
const DUR = [0, 900, 2000, 900];
async function step(ms, p){
  for (let t=0; t<ms; t+=100) {
    if (S.stop) return false;
    await wait(100);
    const d = (30 + Math.random()*140) * (p.stage===2 ? 3 : 1) | 0;
    p.tokens = (p.tokens||0) + d; S.run.tokens += d; S.used += d; live();
  }
  return true;
}
async function sweep(){
  if (S.running) return;
  if (!visible().some(p=>p.state==='queued') && S.pool.length) S.prs.unshift({...S.pool.shift(), id:nextId++, state:'queued', stage:0, tokens:0});
  S.running = true; S.stop = false; S.open = null;
  S.run = {started:Date.now(), tokens:0, repo:null, phase:null, done:[]};
  render();
  outer: for (const repo of Object.keys(S.repoDraft)) {
    S.run.repo = repo;
    for (const ph of ['Listing PRs','Indexing']) { S.run.phase = ph; render(); await wait(650); if (S.stop) break outer; }
    S.run.phase = 'Reviewing';
    for (const p of ordered().filter(q=>q.state==='queued' && q.repo===repo)) {
      p.state = 'running';
      for (let st=1; st<=3; st++) { p.stage = st; render(); if (!await step(DUR[st], p)) { p.state = 'queued'; p.stage = 0; break outer; } }
      p.state = 'done'; p.verdict = p.pending; p.reason = p.pendingReason; p.held = S.hold && p.verdict!=='skipped';
      p.stage = p.verdict==='skipped' ? 1 : p.held ? 3 : 4;
      render(); flash(p); updateBudget();
      if (S.notify && (!S.cfg.notifyChanges || p.verdict==='changes')) chime(S.cfg.sound);
      await wait(350);
    }
    S.run.done.push(repo);
  }
  S.last = {dur:(Date.now()-S.run.started)/1000, tokens:S.run.tokens, stopped:S.stop};
  S.run = null; S.running = false; S.stop = false; S.next = S.sched.every*60; render();
}
setInterval(() => { if (!S.running && S.sched.pause==='run' && --S.next <= 0) sweep(); live(); }, 1000);

$('#side').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of $('#side').querySelectorAll('button')) x.setAttribute('aria-current', x===b);
  for (const p of document.querySelectorAll('.pane')) p.hidden = p.id !== b.dataset.p;
  render();
});
$('#glyph').onclick = () => { const c = pop.classList.toggle('closed'); $('#glyph').setAttribute('aria-expanded', !c); };
$('#go').onclick = $('#wgo').onclick = sweep;
$('#tomlbtn').onclick = () => { updateToml(); $('#drawer').classList.toggle('on'); };
$('#tomlx').onclick = () => $('#drawer').classList.remove('on');
S.prs.forEach(p => p.lines = 40 + hash(p.title)%1900);
applyLook(); updateToml();
render();
</script>
