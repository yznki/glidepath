<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="onb.css">
<style>.srch{height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--control);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--faint);margin-top:32px}
.rp{display:flex;align-items:center;gap:16px;height:56px;box-shadow:inset 0 1px var(--line)}
.rp:first-child{box-shadow:none}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--control);flex:none;position:relative}
.cb.on{background:var(--text);border-color:var(--text)}
.cb.on:after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rp .grow{flex:1;min-width:0}.rp .t{font-size:14px}.rp .n{font-size:12px;color:var(--muted);flex:none}</style></head><body>
<div class="win"><div class="lights"><i></i><i></i><i></i></div><div class="ob">
<div class="path" data-approach="2"></div>
<div class="pane"><div class="body">
  <h1>Which repos?</h1>
  <p class="lead">From your GitHub account and orgs. You can add more later.</p>
  <div class="srch">Search 38 repos</div>
  <div style="margin-top:8px">
    <div class="rp"><div class="cb on"></div><div class="grow"><div class="t">lumen/api</div><div class="m">Go · pushed 12 min ago</div></div><div class="n num">14 open PRs</div></div>
    <div class="rp"><div class="cb on"></div><div class="grow"><div class="t">lumen/web</div><div class="m">TypeScript · pushed 1 h ago</div></div><div class="n num">9 open PRs</div></div>
    <div class="rp"><div class="cb"></div><div class="grow"><div class="t">lumen/infra</div><div class="m">HCL · pushed yesterday</div></div><div class="n num">2 open PRs</div></div>
    <div class="rp"><div class="cb"></div><div class="grow"><div class="t">yznki/dotfiles</div><div class="m">Shell · pushed last week</div></div><div class="n num">0 open PRs</div></div>
  </div></div>
  <div class="bar"><button class="btn text">Back</button><span class="sp"></span><span class="hint">2 selected</span><button class="btn primary big">Continue</button></div>
</div></div></div>
<script src="kit.js"></script></body></html>
