<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4468"/>
      <stop offset="0.40" stop-color="#10304D"/>
      <stop offset="0.50" stop-color="#0A1C2E"/>
      <stop offset="1" stop-color="#050E18"/>
    </linearGradient>
    <radialGradient id="horizon" r="0.5">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3550"/>
      <stop offset="1" stop-color="#0E2236"/>
    </linearGradient>
    <radialGradient id="glow" r="0.5">
      <stop offset="0" stop-color="#FFC24D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFC24D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- horizon glow -->
    <ellipse cx="512" cy="462" rx="420" ry="96" fill="url(#horizon)"/>

    <!-- runway in perspective: vanishing at (512,452) -->
    <polygon points="494,470 530,470 760,924 264,924" fill="url(#strip)"/>

    <!-- centreline dashes, growing toward the viewer -->
    <g fill="#E9EEF4">
      <rect x="510.5" y="486" width="3" height="10" rx="1.5"/>
      <rect x="510" y="512" width="4" height="16" rx="2"/>
      <rect x="509" y="552" width="6" height="26" rx="3"/>
      <rect x="507.5" y="614" width="9" height="40" rx="4.5"/>
      <rect x="505" y="706" width="14" height="62" rx="7"/>
      <rect x="501" y="842" width="22" height="92" rx="11"/>
    </g>

    <!-- edge lights -->
    <g fill="#F6F1E4">
      <circle cx="489" cy="482" r="2.5"/><circle cx="535" cy="482" r="2.5"/>
      <circle cx="481" cy="506" r="3.2"/><circle cx="543" cy="506" r="3.2"/>
      <circle cx="469" cy="540" r="4"/><circle cx="555" cy="540" r="4"/>
      <circle cx="451" cy="588" r="5"/><circle cx="573" cy="588" r="5"/>
      <circle cx="424" cy="656" r="6.5"/><circle cx="600" cy="656" r="6.5"/>
      <circle cx="383" cy="752" r="8.5"/><circle cx="641" cy="752" r="8.5"/>
      <circle cx="322" cy="892" r="11"/><circle cx="702" cy="892" r="11"/>
    </g>

    <!-- PAPI: on the glide path = two white, two red -->
    <g>
      <circle cx="262" cy="712" r="10" fill="#F6F1E4"/>
      <circle cx="288" cy="712" r="10" fill="#F6F1E4"/>
      <circle cx="314" cy="712" r="10" fill="#FF5A4E"/>
      <circle cx="340" cy="712" r="10" fill="#FF5A4E"/>
    </g>

    <!-- threshold: the landing light, brand amber -->
    <circle cx="512" cy="470" r="70" fill="url(#glow)"/>
    <circle cx="512" cy="470" r="14" fill="#FFB020"/>
  </g>

  <!-- top-edge highlight -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
</svg>
